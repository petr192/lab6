services:
  postgres:
    image: "postgres:16.3"
    container_name: "postgres2"
    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
      - POSTGRES_DB=airflow
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data

  airflow-initdb:
    image: petr192/airflow-lab6
    depends_on:
      - postgres
    environment:
      - AIRFLOW_HOME=/usr/local/airflow
      - PATH=/root/.local/bin:$PATH
    volumes:
      - ./dags:/usr/local/airflow/dags
      - ./airflow.cfg:/usr/local/airflow/airflow.cfg
    entrypoint: >
      bash -c "airflow db migrate && airflow connections create-default-connections"

  airflow-webserver:
    image: petr192/airflow-lab6
    restart: always
    depends_on:
      - postgres
    environment:
      - AIRFLOW_HOME=/usr/local/airflow
      - PATH=/root/.local/bin:$PATH
    volumes:
      - ./dags:/usr/local/airflow/dags
      - ./airflow.cfg:/usr/local/airflow/airflow.cfg
    ports:
      - "8080:8080"
    entrypoint: airflow webserver

  airflow-scheduler:
    image: petr192/airflow-lab6
    restart: always
    depends_on:
      - postgres
    environment:
      - AIRFLOW_HOME=/usr/local/airflow
      - PATH=/root/.local/bin:$PATH
    volumes:
      - ./dags:/usr/local/airflow/dags
      - ./airflow.cfg:/usr/local/airflow/airflow.cfg
    entrypoint: airflow scheduler

